services:
  mysql:
    image: mysql:8.4
    command: ["--innodb-autoinc-lock-mode=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      MYSQL_DATABASE: chatroom
      MYSQL_USER: chatroom
      MYSQL_PASSWORD: ${CHATROOM_DB_PASSWORD:-chatroom_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - chatroom-mysql:/var/lib/mysql

  migration:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${CHATROOM_DB_PASSWORD:-chatroom_dev_only}
    volumes:
      - ./migrations:/migrations:ro
    command: ["sh", "-c", "mysql -hmysql -uchatroom chatroom < /migrations/001_initial.sql"]

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      CHATROOM_DB_HOST: mysql
      CHATROOM_DB_NAME: chatroom
      CHATROOM_DB_USER: chatroom
      CHATROOM_DB_PASSWORD: ${CHATROOM_DB_PASSWORD:-chatroom_dev_only}
      CHATROOM_WORKER_COUNT: ${CHATROOM_WORKER_COUNT:-256}
      CHATROOM_DB_POOL_SIZE: ${CHATROOM_DB_POOL_SIZE:-128}
      CHATROOM_BATCH_WRITER_COUNT: ${CHATROOM_BATCH_WRITER_COUNT:-8}
    ports:
      - "7777:7777"
    stop_grace_period: 10s

volumes:
  chatroom-mysql:
