services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_test_only
      MYSQL_DATABASE: chatroom
      MYSQL_USER: chatroom
      MYSQL_PASSWORD: chatroom_test_only
    ports:
      - "33067:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
